[defaults]
# Fichier d'inventaire
inventory = hosts
roles_path = roles
#inventory = hosts
#host_key_checking = False

# Désactiver la vérification des clés SSH (pour les environnements de test)
host_key_checking = False

# Fichier de log
log_path = ./ansible.log

# Nombre de processus parallèles
forks = 10

# Timeout de connexion
timeout = 30

# Utilisateur par défaut pour become
become_user = root

# Méthode become
become_method = sudo

# Demander le mot de passe become
become_ask_pass = False

# Fichier contenant le mot de passe become
# Décommenter si vous utilisez un fichier de mot de passe
# become_password_file = ./become_pass.txt

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
# Activer le pipelining pour de meilleures performances
pipelining = True

# Arguments SSH supplémentaires
ssh_args = -o ControlMaster=auto -o ControlPersist=60s

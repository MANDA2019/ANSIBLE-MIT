---
# ============================================
# RÔLE: Notification par Email
# ============================================
# Ce rôle envoie un email de rapport après l'exécution des tâches
#
# Variables requises (à définir dans group_vars ou host_vars):
#   - smtp_host: Serveur SMTP (ex: smtp.gmail.com)
#   - smtp_port: Port SMTP (ex: 587)
#   - smtp_user: Votre adresse email
#   - smtp_password: Mot de passe ou App Password
#   - email_to: Destinataire de l'email
#
# Pour Gmail, vous devez créer un "App Password":
# https://myaccount.google.com/apppasswords

- name: Préparer le rapport d'exécution
  set_fact:
    rapport_date: '{{ ansible_date_time.iso8601 }}'
    rapport_hostname: '{{ ansible_hostname }}'
    rapport_ip: "{{ ansible_default_ipv4.address | default('N/A') }}"
    rapport_os: '{{ ansible_distribution }} {{ ansible_distribution_version }}'
    rapport_uptime: '{{ ansible_uptime_seconds | int // 3600 }} heures'

- name: Envoyer l'email de notification
  community.general.mail:
    host: '{{ smtp_host }}'
    port: '{{ smtp_port }}'
    username: '{{ smtp_user }}'
    password: '{{ smtp_password }}'
    to: '{{ email_to }}'
    subject: "✅ Ansible - Rapport d'exécution sur {{ rapport_hostname }}"
    subtype: html
    body: |
      <html>
      <head>
        <style>
          body { font-family: Arial, sans-serif; background-color: #f5f5f5; padding: 20px; }
          .container { background: white; border-radius: 10px; padding: 20px; max-width: 600px; margin: auto; }
          .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 20px; border-radius: 10px 10px 0 0; text-align: center; }
          .content { padding: 20px; }
          .success { color: #27ae60; }
          .info-table { width: 100%; border-collapse: collapse; margin: 20px 0; }
          .info-table td { padding: 10px; border-bottom: 1px solid #eee; }
          .info-table td:first-child { font-weight: bold; color: #666; width: 40%; }
          .footer { text-align: center; color: #999; font-size: 12px; margin-top: 20px; }
        </style>
      </head>
      <body>
        <div class="container">
          <div class="header">
            <h1>📋 Rapport Ansible</h1>
          </div>
          <div class="content">
            <h2 class="success">✅ Exécution terminée avec succès!</h2>
            
            <table class="info-table">
              <tr>
                <td>🖥️ Serveur</td>
                <td>{{ rapport_hostname }}</td>
              </tr>
              <tr>
                <td>🌐 Adresse IP</td>
                <td>{{ rapport_ip }}</td>
              </tr>
              <tr>
                <td>💻 Système</td>
                <td>{{ rapport_os }}</td>
              </tr>
              <tr>
                <td>⏱️ Uptime</td>
                <td>{{ rapport_uptime }}</td>
              </tr>
              <tr>
                <td>📅 Date d'exécution</td>
                <td>{{ rapport_date }}</td>
              </tr>
              <tr>
                <td>📝 Tâches exécutées</td>
                <td>{{ tasks_executed | default('Maintenance complète') }}</td>
              </tr>
            </table>
            
            <p>Ce rapport a été généré automatiquement par Ansible.</p>
          </div>
          <div class="footer">
            <p>Projet Ansible - Maharavo L2</p>
          </div>
        </div>
      </body>
      </html>
  delegate_to: localhost
  become: no
  ignore_errors: yes
  when:
    - smtp_host is defined
    - smtp_user is defined
    - email_to is defined

- name: Afficher confirmation d'envoi
  debug:
    msg: '📧 Email de notification envoyé à {{ email_to }}'
  when:
    - smtp_host is defined
    - email_to is defined

- name: Avertissement si email non configuré
  debug:
    msg: '⚠️ Email non envoyé - Configuration SMTP manquante. Définissez smtp_host, smtp_user, smtp_password et email_to dans group_vars/remote.yml'
  when: smtp_host is not defined or email_to is not defined

---
# ============================================
# VARIABLES GLOBALES POUR TOUS LES HÔTES DISTANTS
# ============================================

# Configuration réseau par défaut
dns: '8.8.8.8'
dns_secondary: '8.8.4.4'
netmask: '24'

# Options d'exécution des rôles
configure_network: false # Mettre à true pour configurer le réseau
install_mariadb: false # Mettre à true pour installer MariaDB
send_notification: true # Mettre à true pour envoyer un email après exécution

# ============================================
# CONFIGURATION EMAIL (Notifications)
# ============================================
# Pour Gmail:
#   1. Activez "Accès moins sécurisé" OU
#   2. Créez un "App Password" sur https://myaccount.google.com/apppasswords
#
# Pour Outlook/Hotmail:
#   smtp_host: smtp.office365.com
#   smtp_port: 587
#
# Pour Yahoo:
#   smtp_host: smtp.mail.yahoo.com
#   smtp_port: 587

smtp_host: 'smtp.gmail.com' # Serveur SMTP
smtp_port: 587 # Port (587 pour TLS, 465 pour SSL)
smtp_user: '{{ email_address }}' # Votre email (défini dans secret.yml)
smtp_password: '{{ email_password }}' # Mot de passe (défini dans secret.yml)
email_to: '{{ email_address }}' # Destinataire (peut être différent)

# Configuration MariaDB (les mots de passe sont dans secret.yml)
databases:
  - name: webapp_db
    encoding: utf8mb4
    collation: utf8mb4_general_ci
  - name: monitoring_db
    encoding: utf8mb4
    collation: utf8mb4_general_ci

# Utilisateurs de base de données
db_users:
  - username: webapp_user
    password: '{{ webapp_db_password }}'
    database: webapp_db
    host: localhost
  - username: monitor_user
    password: '{{ monitor_db_password }}'
    database: monitoring_db
    host: localhost

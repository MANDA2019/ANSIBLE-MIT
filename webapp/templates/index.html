<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎯 Ansible MIT Dashboard - Réseaux S4</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet"/>
  <style>
    :root {
      --primary: #3b82f6; --primary-dark: #2563eb; --success: #10b981; --danger: #ef4444;
      --warning: #f59e0b; --dark: #1f2937; --darker: #111827; --card-bg: rgba(31,41,55,0.95);
      --border-color: rgba(255,255,255,0.15); --text-primary: #ffffff; --text-secondary: #d1d5db;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: 'Segoe UI', sans-serif; 
      background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 50%, #16213e 100%);
      color: var(--text-primary); min-height: 100vh; padding: 20px;
    }
    .container { max-width: 1400px; margin: 0 auto; }
    
    /* Navbar */
    .navbar { background: rgba(17,24,39,0.9); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border-color); padding: 1rem 2rem; }
    .navbar-brand { font-weight: 700; font-size: 1.5rem; color: var(--text-primary) !important; }
    .navbar-brand i { color: var(--primary); }
    
    /* Stats */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin: 30px 0; }
    .stat-card { background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); padding: 25px; border-radius: 20px; text-align: center; border: 1px solid rgba(255,255,255,0.2); }
    .stat-number { font-size: 2.5em; font-weight: bold; background: linear-gradient(45deg, #00d4aa, #00b894); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    
    /* Config Hôte */
    .config-panel { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 25px; border-radius: 20px; margin: 30px 0; }
    .form-group { margin-bottom: 18px; }
    .form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #f0f0f0; }
    .form-group input { width: 100%; padding: 12px; border: none; border-radius: 12px; font-size: 16px; background: rgba(255,255,255,0.95); color: #333; }
    .btn-save { background: linear-gradient(45deg, #00d4aa, #00b894); color: white; border: none; padding: 15px; border-radius: 25px; font-size: 18px; cursor: pointer; width: 100%; }
    
    /* Hosts */
    .hosts-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 25px; margin: 30px 0; }
    .host-card { background: rgba(255,255,255,0.08); backdrop-filter: blur(15px); border-radius: 20px; padding: 25px; border: 1px solid rgba(255,255,255,0.15); }
    .host-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .host-ip { color: #00d4aa; font-weight: bold; }
    .action-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 12px; }
    .action-btn { padding: 12px; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; font-size: 14px; transition: all 0.3s; }
    .btn-ping { background: #00d4aa; color: white; }
    .btn-dns { background: #667eea; color: white; }
    .btn-ssh { background: #ff6b6b; color: white; }
    .btn-tls { background: linear-gradient(45deg, #f093fb, #f5576c); color: white; }
    
    /* Logs */
    .logs-panel { background: rgba(0,0,0,0.4); border-radius: 20px; padding: 25px; margin-top: 30px; max-height: 400px; overflow-y: auto; }
    .log-entry { padding: 12px 15px; margin-bottom: 10px; border-radius: 12px; font-family: monospace; font-size: 14px; }
    .log-success { background: rgba(0,212,170,0.2); border-left: 4px solid #00d4aa; }
    .log-error { background: rgba(255,107,107,0.2); border-left: 4px solid #ff6b6b; }
    .log-info { background: rgba(102,126,234,0.2); border-left: 4px solid #667eea; }
  </style>
</head>
<body>
  <div class="container">
    <header class="text-center mb-5">
      <h1 style="background: linear-gradient(45deg, #667eea, #764ba2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 3em;">
        🎯 Dashboard Ansible MIT
      </h1>
      <p class="lead">Automatisation Réseaux S4 - Déploiement 1 clic</p>
    </header>

    <!-- ⚙️ CONFIGURATION HÔTE -->
    <div class="config-panel">
      <h3>⚙️ Configurer hôte actif</h3>
      <div class="row">
        <div class="col-md-8">
          <div class="row">
            <div class="col-md-6 form-group">
              <label>Nom hôte</label>
              <input type="text" id="hostName" placeholder="pc2" value="pc2">
            </div>
            <div class="col-md-6 form-group">
              <label>IP hôte</label>
              <input type="text" id="hostIp" placeholder="192.168.1.29" value="192.168.1.29">
            </div>
            <div class="col-md-6 form-group">
              <label>User SSH</label>
              <input type="text" id="sshUser" placeholder="nax" value="nax">
            </div>
            <div class="col-md-6 form-group">
              <label>Mot de passe SSH</label>
              <input type="password" id="sshPass" placeholder="Mot de passe SSH">
            </div>
            <div class="col-md-6 form-group">
              <label>Mot de passe sudo</label>
              <input type="password" id="sudoPass" placeholder="Mot de passe sudo">
            </div>
          </div>
        </div>
        <div class="col-md-4 d-flex align-items-end">
          <button onclick="saveHostConfig()" class="btn-save">💾 Sauvegarder</button>
          <div id="configStatus" class="ms-3"></div>
        </div>
      </div>
    </div>

    <!-- Stats -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-number" id="totalExecutions">0</div>
        <div>Exécutions totales</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="successCount">0</div>
        <div>Succès</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="errorCount">0</div>
        <div>Échecs</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="hostsCount">1</div>
        <div>Hôtes actifs</div>
      </div>
    </div>

    <!-- Hôtes -->
    <div class="hosts-grid" id="hostsGrid"></div>

    <!-- Logs -->
    <div class="logs-panel">
      <h3>📋 Journal d'activité</h3>
      <div id="logsContainer">
        <div class="log-entry log-info">Dashboard prêt ! Sélectionnez un hôte et cliquez sur une action.</div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    let executionCount = 0, successCount = 0, errorCount = 0;
    const hosts = [{ name: 'pc2', ip: '192.168.1.29', status: 'ready' }];

    // 💾 Config dynamique
    function saveHostConfig() {
      const config = {
        hostName: document.getElementById('hostName').value,
        hostIp: document.getElementById('hostIp').value,
        sshUser: document.getElementById('sshUser').value,
        sshPass: document.getElementById('sshPass').value,
        sudoPass: document.getElementById('sudoPass').value
      };
      localStorage.setItem('ansibleHostConfig', JSON.stringify(config));
      document.getElementById('configStatus').innerHTML = '<div style="color:#00d4aa;font-weight:bold;">✅ Config sauvegardée !</div>';
      setTimeout(() => document.getElementById('configStatus').innerHTML = '', 3000);
      refreshHosts();
    }

    function loadSavedConfig() {
      try {
        const config = JSON.parse(localStorage.getItem('ansibleHostConfig') || '{}');
        if (config.hostName) {
          document.getElementById('hostName').value = config.hostName;
          document.getElementById('hostIp').value = config.hostIp;
          document.getElementById('sshUser').value = config.sshUser;
          document.getElementById('sshPass').value = config.sshPass || '';
          document.getElementById('sudoPass').value = config.sudoPass || '';
        }
      } catch(e) {}
    }

    async function executeAction(action, host) {
      const config = JSON.parse(localStorage.getItem('ansibleHostConfig') || '{}');
      
      if (!config.hostIp || !config.sshPass) {
        addLog('❌ Configurez d\'abord l\'hôte !', 'error');
        return;
      }

      addLog(`📝 Lancement de "${action}" sur ${host}...`, 'info');
      
      try {
        const response = await fetch('/api/execute', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action, host, config })
        });
        const data = await response.json();
        
        executionCount++;
        updateStats();
        
        if (data.success) {
          addLog(`✅ ${action.toUpperCase()} terminé sur ${host}`, 'success');
          successCount++;
        } else {
          addLog(`❌ Erreur ${action}: ${data.error}`, 'error');
          errorCount++;
        }
        updateStats();
      } catch(err) {
        addLog(`❌ Erreur réseau: ${err.message}`, 'error');
        errorCount++;
        updateStats();
      }
    }

    function addLog(message, type = 'info') {
      const container = document.getElementById('logsContainer');
      const entry = document.createElement('div');
      entry.className = `log-entry log-${type}`;
      entry.innerHTML = `[${new Date().toLocaleTimeString()}] ${message}`;
      container.insertBefore(entry, container.firstChild);
      while (container.children.length > 50) container.removeChild(container.lastChild);
    }

    function updateStats() {
      document.getElementById('totalExecutions').textContent = executionCount;
      document.getElementById('successCount').textContent = successCount;
      document.getElementById('errorCount').textContent = errorCount;
    }

    function refreshHosts() {
      const config = JSON.parse(localStorage.getItem('ansibleHostConfig') || '{}');
      const grid = document.getElementById('hostsGrid');
      grid.innerHTML = '';

      hosts.forEach(host => {
        const card = document.createElement('div');
        card.className = 'host-card';
        card.innerHTML = `
          <div class="host-header">
            <h3>🖥️ ${host.name}</h3>
            <span class="host-ip">${config.hostIp || host.ip}</span>
          </div>
          <div class="action-grid">
            <button class="action-btn btn-ping" onclick="executeAction('ping', '${host.name}')">🔌 Ping</button>
            <button class="action-btn btn-dns" onclick="executeAction('dns', '${host.name}')">🌐 DNS</button>
            <button class="action-btn btn-ssh" onclick="executeAction('ssh', '${host.name}')">🔐 SSH</button>
            <button class="action-btn btn-tls" onclick="executeAction('tls', '${host.name}')">🔒 TLS</button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // Init
    window.onload = () => {
      loadSavedConfig();
      refreshHosts();
      addLog('✅ Dashboard Ansible MIT chargé avec succès ! 🎉', 'success');
    };
  </script>
</body>
</html>

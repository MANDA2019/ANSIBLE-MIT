<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>🚀 Dashboard Ansible Multi-Hôtes</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 1200px; margin: 0 auto; padding: 20px; background: #f5f5f5; }
    .container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    h1 { color: #1e40af; text-align: center; }
    .form-group { margin: 20px 0; }
    input, button { padding: 10px; font-size: 14px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
    button { background: #3b82f6; color: white; border: none; cursor: pointer; font-weight: bold; margin: 5px; }
    button:hover { background: #2563eb; }
    button:disabled { background: #9ca3af; cursor: not-allowed; }
    .btn-restore { background: #f59e0b !important; }
    .btn-restore:hover { background: #d97706 !important; }
    .btn-danger { background: #ef4444 !important; }
    .btn-danger:hover { background: #dc2626 !important; }
    .status { padding: 15px; margin: 10px 0; border-radius: 5px; }
    .success { background: #d1fae5; color: #065f46; border: 1px solid #a7f3d0; }
    .error { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
    .warning { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; }
    .host-card { border: 2px solid #e5e7eb; padding: 15px; margin: 10px 0; border-radius: 8px; background: #f9fafb; }
    .host-card.selected { border-color: #3b82f6; background: #eff6ff; }
    .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; }
    .summary-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    .summary-table th, .summary-table td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    .summary-table th { background: #f3f4f6; }
    .backup-info { background: #fef3c7; padding: 10px; border-radius: 5px; margin: 10px 0; font-size: 12px; }
    @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="container">
    <h1>🚀 Dashboard Ansible Multi-Hôtes (Debian/Ubuntu)</h1>
    <p>Configurez SSH + DNS + TLS sur plusieurs PCs → sélectionnez avant config !</p>
    
    <div class="form-group">
      <h3>🌐 Serveurs cibles</h3>
      <button onclick="addHost()" style="width:auto; padding:10px 20px; background:#10b981;">➕ Ajouter PC</button>
      <button onclick="loadDefaultHosts()" style="width:auto; padding:10px 20px; background:#f59e0b;">🔄 PCs par défaut</button>
      <div id="hostsList"></div>
    </div>

    <div class="grid">
      <div>
        <h4>🔐 SSH + sudo</h4>
        <button onclick="configSSH()" id="sshBtn">Configurer SSH (0)</button>
        <div id="sshStatus"></div>
      </div>
      <div>
        <h4>🌐 DNS</h4>
        <button onclick="configDNS()" id="dnsBtn">Configurer DNS (0)</button>
        <button onclick="restoreDNS()" class="btn-restore" id="restoreDnsBtn">🔄 Restaurer DNS (0)</button>
        <div class="backup-info" id="dnsBackupInfo" style="display:none;">
          📁 Backup: <span id="dnsBackupPath"></span>
        </div>
        <div id="dnsStatus"></div>
      </div>
      <div>
        <h4>🔒 TLS/HTTPS</h4>
        <button onclick="configTLS()" id="tlsBtn">Configurer HTTPS (0)</button>
        <div id="tlsStatus"></div>
      </div>
    </div>

    <div style="margin-top: 30px;">
      <h4>📋 Résumé Multi-Hôtes</h4>
      <div id="summary"></div>
    </div>
  </div>

  <script>
    let hosts = [];

    const defaultHosts = [
      {ip:'192.168.1.29', user:'nax', ssh:'rensnax77', sudo:'140724', host:'pc2.local', selected:true, sshStatus:'', dnsStatus:'', tlsStatus:'', dnsBackup:''}
    ];

    function addHost() {
      hosts.push({ip:'', user:'', ssh:'', sudo:'', host:'', selected:true, sshStatus:'', dnsStatus:'', tlsStatus:'', dnsBackup:''});
      renderHosts();
    }

    function loadDefaultHosts() {
      hosts = [...defaultHosts];
      renderHosts();
    }

    function removeHost(index) {
      hosts.splice(index, 1);
      renderHosts();
    }

    function renderHosts() {
      let html = '';
      hosts.forEach((h, i) => {
        const selected = h.selected ? 'selected' : '';
        const backupInfo = h.dnsBackup ? `<br>📁 Backup: ${h.dnsBackup}` : '';
        html += `
          <div class="host-card ${selected}" ondblclick="toggleSelect(${i})">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
              <strong>PC ${i+1}: ${h.host || 'Nouveau'}</strong>
              <div>
                <label style="margin-right:10px;">
                  <input type="checkbox" ${h.selected?'checked':''} onchange="hosts[${i}].selected=this.checked; renderHosts(); updateButtons();">
                  Sélectionné
                </label>
                <button onclick="removeHost(${i})" class="btn-danger" style="padding:5px 10px; font-size:12px;">❌</button>
              </div>
            </div>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; font-size:13px;">
              <div>IP: <input size=12 value="${h.ip}" onchange="hosts[${i}].ip=this.value; renderHosts();"></div>
              <div>User: <input size=6 value="${h.user}" onchange="hosts[${i}].user=this.value"></div>
              <div>SSH: <input size=8 type=password value="${h.ssh}" onchange="hosts[${i}].ssh=this.value"></div>
              <div>Sudo: <input size=8 type=password value="${h.sudo}" onchange="hosts[${i}].sudo=this.value"></div>
              <div>Domaine: <input size=12 value="${h.host}" onchange="hosts[${i}].host=this.value; renderHosts();"></div>
              <div style="color:#6b7280; font-size:12px;">
                SSH:${h.sshStatus?'✅':'❌'} 
                DNS:${h.dnsStatus?'✅':'❌'} 
                TLS:${h.tlsStatus?'✅':'❌'}
                ${backupInfo}
              </div>
            </div>
          </div>
        `;
      });
      document.getElementById('hostsList').innerHTML = html || '<p style="color:#9ca3af;">➕ Cliquez "Ajouter PC" ou "PCs par défaut"</p>';
      updateButtons();
      updateSummary();
    }

    function toggleSelect(i) {
      hosts[i].selected = !hosts[i].selected;
      renderHosts();
    }

    function getSelectedHosts() {
      return hosts.filter(h => h.selected);
    }

    function updateButtons() {
      const selected = getSelectedHosts().length;
      document.getElementById('sshBtn').textContent = `Configurer SSH (${selected})`;
      document.getElementById('dnsBtn').textContent = `Configurer DNS (${selected})`;
      document.getElementById('tlsBtn').textContent = `Configurer HTTPS (${selected})`;
      document.getElementById('restoreDnsBtn').textContent = `🔄 Restaurer DNS (${selected})`;
      
      // Afficher info backup si DNS configuré
      const hasBackup = hosts.some(h => h.selected && h.dnsBackup);
      document.getElementById('dnsBackupInfo').style.display = hasBackup ? 'block' : 'none';
    }

    async function apiCall(endpoint, data) {
      try {
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        const result = await response.json();
        return result;
      } catch (error) {
        return { success: false, error: error.message };
      }
    }

    async function configSSH() {
      const selected = getSelectedHosts();
      if(selected.length === 0) {
        alert('Sélectionnez au moins un PC !');
        return;
      }
      
      document.getElementById('sshStatus').innerHTML = '<div class="status">⏳ Configuration SSH en cours...</div>';
      
      for(let host of selected) {
        const result = await apiCall('/universal-ssh', host);
        if(result.success) {
          host.sshStatus = '✅';
        } else {
          host.sshStatus = '❌ ' + (result.error || 'Erreur');
        }
        renderHosts();
      }
      
      document.getElementById('sshStatus').innerHTML = `<div class="success">✅ SSH configuré sur ${selected.length} PC(s)</div>`;
      updateSummary();
    }

    async function configDNS() {
      const selected = getSelectedHosts();
      if(selected.length === 0) {
        alert('Sélectionnez au moins un PC !');
        return;
      }
      
      document.getElementById('dnsStatus').innerHTML = '<div class="status warning">⚠️ Sauvegarde en cours...</div>';
      
      for(let host of selected) {
        const result = await apiCall('/universal-dns', host);
        if(result.success) {
          host.dnsStatus = '✅';
          host.dnsBackup = result.backup || 'Backup créé';
        } else {
          host.dnsStatus = '❌';
        }
        renderHosts();
      }
      
      document.getElementById('dnsStatus').innerHTML = `
        <div class="success">
          ✅ DNS configuré sur ${selected.length} PC(s)<br>
          📁 Configuration sauvegardée - Utilisez le bouton "Restaurer" pour revenir en arrière
        </div>`;
      updateSummary();
    }

    async function restoreDNS() {
      const selected = getSelectedHosts();
      if(selected.length === 0) {
        alert('Sélectionnez au moins un PC !');
        return;
      }
      
      if(!confirm('⚠️ Voulez-vous vraiment restaurer la configuration DNS d\'avant ?')) {
        return;
      }
      
      document.getElementById('dnsStatus').innerHTML = '<div class="status warning">🔄 Restauration en cours...</div>';
      
      for(let host of selected) {
        const result = await apiCall('/restore-dns', host);
        if(result.success) {
          host.dnsStatus = '🔄 Restauré';
          host.dnsBackup = '';
        } else {
          host.dnsStatus = '❌ Erreur restauration';
        }
        renderHosts();
      }
      
      document.getElementById('dnsStatus').innerHTML = `<div class="success">✅ DNS restauré sur ${selected.length} PC(s)</div>`;
      updateSummary();
    }

    async function configTLS() {
      const selected = getSelectedHosts();
      if(selected.length === 0) {
        alert('Sélectionnez au moins un PC !');
        return;
      }
      
      document.getElementById('tlsStatus').innerHTML = '<div class="status">⏳ Configuration TLS en cours...</div>';
      
      for(let host of selected) {
        const result = await apiCall('/universal-tls', host);
        if(result.success) host.tlsStatus = '✅';
        else host.tlsStatus = '❌';
        renderHosts();
      }
      
      document.getElementById('tlsStatus').innerHTML = `<div class="success">✅ TLS configuré sur ${selected.length} PC(s)</div>`;
      updateSummary();
    }

    function updateSummary() {
      let html = '<table class="summary-table"><tr><th>PC</th><th>IP/Domaine</th><th>SSH</th><th>DNS</th><th>TLS</th><th>Test</th></tr>';
      hosts.forEach((h, i) => {
        if(h.selected) {
          html += `<tr>
            <td>${i+1}</td>
            <td>${h.ip} (${h.host})</td>
            <td>${h.sshStatus || '❌'}</td>
            <td>${h.dnsStatus || '❌'}</td>
            <td>${h.tlsStatus || '❌'}</td>
            <td><a href="https://${h.ip}" target="_blank">🔗 Test</a></td>
          </tr>`;
        }
      });
      html += '</table>';
      document.getElementById('summary').innerHTML = html;
    }

    // Initialisation
    loadDefaultHosts();
  </script>
</body>
</html>

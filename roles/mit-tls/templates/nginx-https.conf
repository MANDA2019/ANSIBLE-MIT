server {
    listen 80;
    listen [::]:80;
    server_name {{ tls_domain }} www.{{ tls_domain }};
    
    # Let's Encrypt validation
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    # Redirection vers HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# Configuration HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name {{ tls_domain }} www.{{ tls_domain }};
    
    # Certificats SSL
    ssl_certificate /etc/nginx/ssl/{{ tls_domain }}.crt;
    ssl_certificate_key /etc/nginx/ssl/{{ tls_domain }}.key;
    
    # Configuration SSL sécurisée
    include snippets/ssl-params.conf;
    
    # Root directory
    root /var/www/html;
    index index.html index.htm index.php;
    
    # Logs
    access_log /var/log/nginx/{{ tls_domain }}_access.log;
    error_log /var/log/nginx/{{ tls_domain }}_error.log;
    
    # Main location
    location / {
        try_files $uri $uri/ =404;
    }
    
    # PHP support (optionnel)
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/var/run/php/php-fpm.sock;
    }
    
    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }
    
    # Cache static files
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
